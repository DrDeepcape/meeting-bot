services:
  redis:
    image: redis:7-alpine
    # Host-published port is configurable via REDIS_PORT_HOST (default 6379) so it
    # can dodge another local Redis already using :6379:
    #   REDIS_PORT_HOST=6380 docker compose up
    # The bot itself always reaches Redis over the compose network as `redis:6379`.
    #
    # Deepcape-fork (#1789): loopback-sidonta. Redisillä ei ole salasanaa, joten
    # tämä on sen ainoa este — älä poista prefiksiä lisäämättä requirepassia.
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cache:/data

  meeting-bot:
    build:
      context: .
      dockerfile: Dockerfile.development
    # App config (storage provider, uploader, Azure/S3 creds, notifications, etc.)
    # is the source of truth in .env — copy .env.example -> .env. Only the values
    # that must differ inside the compose network are overridden in `environment`.
    #
    # Deepcape-fork (#1789): MEETING_BOT_AUTH_TOKEN tulee myös tätä kautta, eikä
    # se saa esiintyä tässä tiedostossa — tämä on versionhallinnassa, .env ei ole.
    # Ilman sitä join-reitit vastaavat 503:lla (fail-closed, ks. src/middleware/authGate.ts).
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Defaults to the bundled redis service over the compose network (.env's
      # host.docker.internal is wrong for the in-compose redis). Override to attach
      # the bot to another Redis — e.g. a local backend's queue so UI-triggered
      # jobs reach it: REDIS_HOST=host.docker.internal docker compose up
      - REDIS_HOST=${REDIS_HOST:-redis}
      # Deepcape-fork: chrome-cdp-sidecar on poistettu (linux/amd64-only, ei
      # rakennu arm64:lle). Sen korvaa hostilla ajettava oikea, kirjautunut
      # Chrome, jonka start-chrome-cdp-mac.sh käynnistää loopback-CDP-portilla.
      # Docker tavoittaa sen host.docker.internal-nimellä.
      # Set GOOGLE_CHROME_CDP_URL= (empty) to fall back to the in-container browser.
      - GOOGLE_CHROME_CDP_URL=${GOOGLE_CHROME_CDP_URL-http://host.docker.internal:9222}
    # Deepcape-fork (#1787 E3 → #1789): sidonta on loopbackiin, EI 0.0.0.0:aan.
    # Upstreamin "3000:3000" julkaisi rajapinnan kaikille verkkorajapinnoille;
    # mitattuna se vastasi HTTP 200:lla M4:n Tailscale-osoitteesta ilman mitään
    # autentikaatiota. Loopback on ensimmäinen kerros, authGate toinen — kumpikaan
    # ei yksin riitä. Älä palauta muotoon "3000:3000".
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/usr/src/app
      - ./.chrome:/usr/src/app/.chrome
      - ./assets/screenshots:/usr/src/app/assets/screenshots
      - ./debug-videos:/usr/src/app/debug-videos
      - /usr/src/app/node_modules  # Persist node_modules
    command: ["/bin/bash", "./start.sh"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  cache:
